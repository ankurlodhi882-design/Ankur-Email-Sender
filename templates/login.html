<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Secure Mail Console - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="login-page">

<div class="login-card">

    <div class="brand">
        <div class="brand-icon">✉</div>

        <div>
            <h1>Secure Mail Console</h1>
            <p>Authorized email sending panel</p>
        </div>
    </div>

    {% if error %}
        <div class="alert error">
            {{ error }}
        </div>
    {% endif %}

    <form
        method="POST"
        action="{{ url_for('login_post') }}"
    >

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            class="primary-btn"
        >
            Sign In
        </button>

    </form>

</div>

</body>
</html>
