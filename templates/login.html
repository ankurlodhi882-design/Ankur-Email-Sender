<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Mail Console - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="login-page">

    <div class="login-card">

        <div class="login-brand">

            <div class="logo">
                ✦
            </div>

            <div>

                <h2>
                    Secure Mail Console
                </h2>

                <p>
                    Secure email workspace
                </p>

            </div>

        </div>


        <h1>
            Welcome Back
        </h1>

        <p class="muted">
            Sign in to access your email dashboard.
        </p>


        {% if error %}

        <div class="error-box">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="/login"
        >

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="primary-button"
            >
                Sign In
            </button>

        </form>


        <div class="footer-text">
            Secure Mail Console
        </div>

    </div>

</body>
</html>
