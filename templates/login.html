<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Mail Login</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">

<div class="login-card">

    <div class="logo">✉</div>

    <h1>Secure Mail Console</h1>

    <p class="muted">
        Sign in to continue
    </p>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST"
          action="{{ url_for('login_post') }}">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Sign In
        </button>

    </form>

</div>

</body>
</html>
