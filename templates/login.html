<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Secure Mail Console</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>

</head>


<body class="login-page">


<div class="login-card">


    <div class="login-brand">

        <div class="logo-mark">
            ✦
        </div>

        <div>

            <div class="logo-title">
                Secure Mail Console
            </div>

            <div class="logo-subtitle">
                Secure email workspace
            </div>

        </div>

    </div>


    <h1>
        Welcome Back
    </h1>

    <p class="login-description">
        Sign in to access your email dashboard.
    </p>


    {% if error %}

    <div class="error-box">
        {{ error }}
    </div>

    {% endif %}


    <form
        method="POST"
        action="/login"
    >

        <label for="username">
            Username
        </label>

        <input
            id="username"
            name="username"
            type="text"
            placeholder="Enter username"
            autocomplete="username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >


        <button
            class="login-button"
            type="submit"
        >
            Sign In
        </button>

    </form>


    <div class="login-footer">
        Secure Mail Console
    </div>


</div>


</body>
</html>
